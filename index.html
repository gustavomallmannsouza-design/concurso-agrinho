<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Concurso Agrinho 2026</title>
    <style>
        /* Estilos Gerais */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #f4f9f4;
            color: #333;
            line-height: 1.6;
        }

        /* Cabeçalho e Menu */
        header {
            background-color: #1e5c33;
            color: white;
            padding: 1rem 2rem;
            position: sticky;
            top: 0;
            z-index: 1000;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }

        header h1 {
            font-size: 1.5rem;
        }

        nav a {
            color: white;
            text-decoration: none;
            margin-left: 1.5rem;
            font-weight: bold;
            transition: color 0.3s;
        }

        nav a:hover {
            color: #f1c40f;
        }

        /* Seção Hero (Banner Principal) */
        .hero {
            background: linear-gradient(rgba(30, 92, 51, 0.8), rgba(30, 92, 51, 0.6)), url('https://images.unsplash.com/photo-1500937386664-56d1dfef3854?ixlib=rb-4.0.3') no-repeat center center/cover;
            height: 60vh;
            color: white;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 0 1rem;
        }

        .hero h2 {
            font-size: 3rem;
            margin-bottom: 1rem;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.5);
        }

        .hero p {
            font-size: 1.2rem;
            max-width: 600px;
            margin-bottom: 2rem;
        }

        .btn {
            background-color: #f1c40f;
            color: #1e5c33;
            padding: 0.75rem 2rem;
            text-decoration: none;
            font-weight: bold;
            border-radius: 5px;
            transition: background 0.3s;
        }

        .btn:hover {
            background-color: #dfb200;
        }

        /* Container de Conteúdo */
        .container {
            max-width: 1100px;
            margin: 3rem auto;
            padding: 0 1.5rem;
        }

        section {
            margin-bottom: 4rem;
        }

        h3 {
            color: #1e5c33;
            font-size: 2rem;
            margin-bottom: 1.5rem;
            border-bottom: 3px solid #f1c40f;
            padding-bottom: 0.5rem;
            display: inline-block;
        }

        /* Cards de Categorias */
        .grid-categorias {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 2rem;
            margin-top: 2rem;
        }

        .card {
            background: white;
            padding: 2rem;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
            border-top: 5px solid #1e5c33;
            text-align: center;
        }

        .card h4 {
            color: #1e5c33;
            margin-bottom: 1rem;
            font-size: 1.3rem;
        }

        /* Cronograma (Tabela) */
        table {
            width: 100%;
            border-collapse: collapse;
            background: white;
            margin-top: 1.5rem;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
            border-radius: 8px;
            overflow: hidden;
        }

        th, td {
            padding: 1rem;
            text-align: left;
        }

        th {
            background-color: #1e5c33;
            color: white;
        }

        tr:nth-child(even) {
            background-color: #f9f9f9;
        }
